    var picked = [];

    function esc(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function tenGod(dStem, tStem) {
      if (dStem === tStem) return "比肩";
      var dE = ELEM[dStem], tE = ELEM[tStem], same = (POL[dStem] === POL[tStem]);
      if (dE === tE) return same ? "比肩" : "劫財";
      if (GEN[dE] === tE) return same ? "食神" : "傷官";
      if (GEN[tE] === dE) return same ? "偏印" : "正印";
      if (OVER[dE] === tE) return same ? "偏財" : "正財";
      if (OVER[tE] === dE) return same ? "七殺" : "正官";
      return "";
    }

    function calcYM(y, m, d) {
      var gy = (m < 2 || (m === 2 && d < 4)) ? y - 1 : y;
      var md = m * 100 + d;
      var mIdx = 1;
      if (md >= 1207) mIdx = 0;
      else if (md >= 1107) mIdx = 11;
      else if (md >= 1008) mIdx = 10;
      else if (md >= 908) mIdx = 9;
      else if (md >= 808) mIdx = 8;
      else if (md >= 707) mIdx = 7;
      else if (md >= 606) mIdx = 6;
      else if (md >= 506) mIdx = 5;
      else if (md >= 405) mIdx = 4;
      else if (md >= 306) mIdx = 3;
      else if (md >= 204) mIdx = 2;
      else if (md >= 106) mIdx = 1;
      else mIdx = 0;

      var yStemIdx = (((gy - 1984) % 10) + 10) % 10;
      var yBrIdx = (((gy - 1984) % 12) + 12) % 12;
      var tigerMap = {0:2,5:2,1:4,6:4,2:6,7:6,3:8,8:8,4:0,9:0};
      var steps = (((mIdx - 2) % 12) + 12) % 12;
      var mStemIdx = (tigerMap[yStemIdx] + steps) % 10;

      return {
        yGZ: STEMS[yStemIdx] + BRANCHES[yBrIdx],
        yStem: STEMS[yStemIdx],
        mGZ: STEMS[mStemIdx] + BRANCHES[mIdx],
        mStem: STEMS[mStemIdx]
      };
    }

    function calcDay(y, m, d) {
      var diff = Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(1984, 1, 2)) / 86400000);
      var sIdx = ((diff % 10) + 10) % 10;
      var bIdx = ((diff % 12) + 12) % 12;
      return { gz: STEMS[sIdx] + BRANCHES[bIdx], stem: STEMS[sIdx], sIdx: sIdx };
    }

    function calcHour(sIdx, hVal) {
      if (hVal === "unknown") return null;
      var h = Number(hVal);
      var bIdx = (h === 23 || h === 0) ? 0 : Math.floor((h + 1) / 2);
      var ratMap = {0:0,5:0,1:2,6:2,2:4,7:4,3:6,8:6,4:8,9:8};
      var hStemIdx = (ratMap[sIdx] + bIdx) % 10;
      return { gz: STEMS[hStemIdx] + BRANCHES[bIdx], stem: STEMS[hStemIdx] };
    }

    function pickOneFromGroup(groupNum) {
      var list = [];
      for (var i = 0; i < DECK_48.length; i++) {
        if (DECK_48[i].group === groupNum) list.push(DECK_48[i]);
      }
      var idx = Math.floor(Math.random() * list.length);
      return list[idx];
    }

    // 分 3 組抽牌：第1組(1~16)抽1張、第2組(17~32)抽1張、第3組(33~48)抽1張
    function draw3Groups() {
      picked = [
        pickOneFromGroup(1),
        pickOneFromGroup(2),
        pickOneFromGroup(3)
      ];
    }

    function refreshAll() {
      var dv = document.getElementById("bDate").value || "1980-11-30";
      var hv = document.getElementById("bHour").value || "11";
      var gv = document.getElementById("bGender").value || "male";
      var q = (document.getElementById("qInput").value || "").trim();

      var p = dv.split("-");
      var y = Number(p[0]) || 1980, m = Number(p[1]) || 11, d = Number(p[2]) || 30;
      var ym = calcYM(y, m, d);
      var day = calcDay(y, m, d);
      var hr = calcHour(day.sIdx, hv);

      var now = new Date();
      var flowYM = calcYM(now.getFullYear(), now.getMonth() + 1, now.getDate());
      var flowYearGod = tenGod(day.stem, flowYM.yStem);
      var flowMonthGod = tenGod(day.stem, flowYM.mStem);

      var four = [
        { n: "年柱", gz: ym.yGZ, sub: tenGod(day.stem, ym.yStem), hint: PILLAR_ROLE[0] },
        { n: "月柱", gz: ym.mGZ, sub: tenGod(day.stem, ym.mStem), hint: PILLAR_ROLE[1] },
        { n: "日柱", gz: day.gz, sub: "日主" + ELEM[day.stem], hint: PILLAR_ROLE[2] },
        { n: "時柱", gz: hr ? hr.gz : "未定", sub: hr ? tenGod(day.stem, hr.stem) : "略過時辰", hint: PILLAR_ROLE[3] }
      ];

      document.getElementById("baziMeta").textContent =
        "日主：" + day.stem + "（" + ELEM[day.stem] + "） · " + (gv === "male" ? "男命" : "女命");

      var pHtml = "";
      for (var i = 0; i < four.length; i++) {
        pHtml += '<div class="pillar">' +
          '<div class="p-name">' + four[i].n + '</div>' +
          '<div class="p-gz">' + four[i].gz + '</div>' +
          '<div class="p-sub">' + four[i].sub + '</div>' +
          '<div class="p-hint">' + four[i].hint + '</div>' +
        '</div>';
      }
      document.getElementById("pillarsBox").innerHTML = pHtml;

      document.getElementById("flowBox").textContent =
        "流年：" + flowYM.yGZ + "（" + flowYearGod + "）｜ 當下流月：" + flowYM.mGZ + "（" + flowMonthGod + "）";

      var monthAdvice = GOD_ADVICE[flowMonthGod] || "順著當下的節奏慢慢調整，不必急著給自己太大壓力。";
      var issueLine = q
        ? ("針對你問的「" + esc(q) + "」，在 " + flowYM.mGZ + "（" + flowMonthGod + "）月裡，先把心裡的焦慮放輕一點，看清什麼是現在能做的事。")
        : ("你目前尚未輸入特定提問；若最近有想釐清的事，可以在上面寫下來，下面的牌卡與建議會直接扣合你的問題。");

      document.getElementById("baziAdviceBox").innerHTML =
        "<strong>流月說明與建議：</strong>" + esc(monthAdvice) + "<br>" +
        "<strong>與你的提問連結：</strong>" + issueLine;

      document.getElementById("qBanner").innerHTML =
        q ? ("目前對齊的提問：「" + esc(q) + "」") : "目前對齊的提問：尚未輸入特定問題（以當下整體狀態與流月節奏為你抽牌）";

      var qLabel = q ? ("「" + q + "」") : "這件事";
      var cHtml = "";
      for (var j = 0; j < picked.length; j++) {
        var card = picked[j];
        cHtml += '<div class="card ' + card.cls + '">' +
          '<div class="card-pos">' + esc(card.pos) + '</div>' +
          '<span class="card-no">第 ' + card.no + ' / 48 張</span>' +
          '<div class="card-title">' + esc(card.name) + ' · ' + esc(card.kw) + '</div>' +
          '<div>' + esc(card.desc) + '</div>' +
          '<div class="card-tip">💡 連結 ' + esc(qLabel) + '（' + esc(flowMonthGod) + '月）：' + esc(card.tip) + '</div>' +
        '</div>';
      }
      document.getElementById("cardsBox").innerHTML = cHtml;

      var rHtml = "<p><strong>先聽見你的提問：</strong>你提到" + esc(q ? ("「" + q + "」") : "想看看現在的狀態與方向") + "。把這份在意放在心上，不用急著立刻給出完美答案。</p>" +
        "<p><strong>流年與當下流月：</strong>目前是 <strong>" + flowYM.yGZ + "</strong> 流年、<strong>" + flowYM.mGZ + "（" + flowMonthGod + "）</strong> 流月。" + esc(monthAdvice) + "</p>" +
        "<p><strong>48 張牌分 3 組抽出的提醒：</strong><br>" +
        "· " + esc(picked[0].pos) + " → <strong>" + esc(picked[0].name) + "</strong>（第" + picked[0].no + "張）：" + esc(picked[0].tip) + "<br>" +
        "· " + esc(picked[1].pos) + " → <strong>" + esc(picked[1].name) + "</strong>（第" + picked[1].no + "張）：" + esc(picked[1].tip) + "<br>" +
        "· " + esc(picked[2].pos) + " → <strong>" + esc(picked[2].name) + "</strong>（第" + picked[2].no + "張）：" + esc(picked[2].tip) + "</p>";
      document.getElementById("replyBox").innerHTML = rHtml;

      var promptText =
        "請用溫暖、有畫面感且不說教的語氣，結合以下資訊為我做深度解析：\n\n" +
        "【提問】\n" + (q || "我想看清當下狀態與流月節奏") + "\n\n" +
        "【八字與流月】\n" +
        (gv === "male" ? "男命" : "女命") + "，出生於 " + dv + "，日主 " + day.stem + "（" + ELEM[day.stem] + "）\n" +
        "四柱：" + four[0].gz + " / " + four[1].gz + " / " + four[2].gz + " / " + four[3].gz + "\n" +
        "流年 " + flowYM.yGZ + "（" + flowYearGod + "），當下流月 " + flowYM.mGZ + "（" + flowMonthGod + "）\n\n" +
        "【48 張開悟卡分 3 組抽牌結果】\n" +
        "1. " + picked[0].pos + "（第" + picked[0].no + "張）：" + picked[0].name + "（" + picked[0].desc + "）\n" +
        "2. " + picked[1].pos + "（第" + picked[1].no + "張）：" + picked[1].name + "（" + picked[1].desc + "）\n" +
        "3. " + picked[2].pos + "（第" + picked[2].no + "張）：" + picked[2].name + "（" + picked[2].desc + "）\n\n" +
        "【回覆要求】\n" +
        "先接住情緒，再緊扣提問連結流月與三組牌卡給出具體微調建議與情緒價值，避免空泛套話。";
      document.getElementById("promptOut").textContent = promptText;
    }

    window.addEventListener("load", function () {
      draw3Groups();
      refreshAll();

      document.getElementById("bDate").addEventListener("change", refreshAll);
      document.getElementById("bHour").addEventListener("change", refreshAll);
      document.getElementById("bGender").addEventListener("change", refreshAll);
      document.getElementById("qInput").addEventListener("input", refreshAll);
      document.getElementById("drawBtn").addEventListener("click", function () {
        draw3Groups();
        refreshAll();
      });

      var tags = document.querySelectorAll(".tag");
      for (var i = 0; i < tags.length; i++) {
        tags[i].addEventListener("click", function () {
          var ta = document.getElementById("qInput");
          var t = this.getAttribute("data-t") || "";
          if (ta.value.indexOf(t) === -1) {
            ta.value = ta.value ? (t + "\n" + ta.value) : (t + "\n");
          }
          refreshAll();
        });
      }

      document.getElementById("adminBtn").addEventListener("click", function () {
        document.getElementById("adminPanel").classList.toggle("show");
      });

      document.getElementById("copyBtn").addEventListener("click", function () {
        var txt = document.getElementById("promptOut").textContent;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt);
        }
        document.getElementById("copyMsg").textContent = "✅ 已複製！";
      });
    });
  </script>
</body>
</html>
